name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # No npm dependencies — the repo is dependency-free by design.

      - name: Drift guard (api/search.js must match api/_shared.js)
        run: node scripts/build-search.js --check

      - name: Syntax check serverless functions
        run: for f in api/*.js; do node --check "$f"; done

      - name: Syntax check client scripts
        run: for f in js/*.js scripts/*.js; do node --check "$f"; done

      - name: Run API proxy tests
        run: node tests/api-search.test.js

      - name: Run final verification tests
        run: node tests/final-verify.test.js
